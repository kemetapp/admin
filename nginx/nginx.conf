events { worker_connections 1024; }

http {
  upstream api { server api:4000; }

  # كاش بلاطات الخريطة — يقلل الحمل على OSM
  proxy_cache_path /var/cache/nginx tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=7d;

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # كاش لبلاطات OSM (اختياري — بيقلل الطلبات الخارجية)
    location /tiles/ {
      proxy_pass https://tile.openstreetmap.org/;
      proxy_cache tiles;
      proxy_cache_valid 200 7d;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_set_header User-Agent "kemet-selfhosted/1.0";
    }
  }
}
